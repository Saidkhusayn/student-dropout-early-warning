[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dropout"
version = "0.1.0"
description = "Early detection of at-risk university students through performance-trajectory modeling"
authors = [{ name = "Saidkhusaynbek Bobojonov" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
